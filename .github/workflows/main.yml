name: Build Signed IIRCo APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          import textwrap

          source = Path("index.html")
          if not source.is_file():
              raise SystemExit(
                  "Missing index.html in the repository root."
              )

          project = Path("android-project")

          def save(name, content):
              target = project / name
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(
                  textwrap.dedent(content).strip() + "\n",
                  encoding="utf-8",
              )

          save("settings.gradle", """
              pluginManagement {
                  repositories {
                      google()
                      mavenCentral()
                      gradlePluginPortal()
                  }
              }
              dependencyResolutionManagement {
                  repositoriesMode.set(
                      RepositoriesMode.FAIL_ON_PROJECT_REPOS
                  )
                  repositories {
                      google()
                      mavenCentral()
                  }
              }
              rootProject.name = 'IIRCoNDT'
              include ':app'
          """)

          save("build.gradle", """
              plugins {
                  id 'com.android.application' version '8.7.3' apply false
              }
          """)

          save("gradle.properties", """
              org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          """)

          save("app/build.gradle", """
              plugins {
                  id 'com.android.application'
              }

              android {
                  namespace 'com.iirco.ndt'
                  compileSdk 35

                  defaultConfig {
                      applicationId 'com.iirco.ndt'
                      minSdk 23
                      targetSdk 35
                      versionCode 2
                      versionName '1.1'
                  }

                  compileOptions {
                      sourceCompatibility JavaVersion.VERSION_17
                      targetCompatibility JavaVersion.VERSION_17
                  }

                  buildTypes {
                      release {
                          minifyEnabled false
                      }
                  }
              }
          """)

          save("app/src/main/AndroidManifest.xml", """
              <?xml version="1.0" encoding="utf-8"?>
              <manifest xmlns:android="http://schemas.android.com/apk/res/android">
                  <application
                      android:allowBackup="false"
                      android:label="IIRCo NDT"
                      android:icon="@drawable/ic_radiation"
                      android:supportsRtl="true"
                      android:usesCleartextTraffic="false"
                      android:theme="@android:style/Theme.Material.NoActionBar">
                      <activity
                          android:name=".MainActivity"
                          android:exported="true"
                          android:windowSoftInputMode="adjustResize">
                          <intent-filter>
                              <action android:name="android.intent.action.MAIN" />
                              <category android:name="android.intent.category.LAUNCHER" />
                          </intent-filter>
                      </activity>
                  </application>
              </manifest>
          """)

          save("app/src/main/res/drawable/ic_radiation.xml", """
              <vector xmlns:android="http://schemas.android.com/apk/res/android"
                  android:width="108dp"
                  android:height="108dp"
                  android:viewportWidth="108"
                  android:viewportHeight="108">
                  <path
                      android:fillColor="#FFD600"
                      android:pathData="M0,0H108V108H0Z" />
                  <path
                      android:fillColor="#111111"
                      android:pathData="M47,54a7,7 0,1 0,14 0a7,7 0,1 0,-14 0" />
                  <path
                      android:fillColor="#111111"
                      android:pathData="M41,54L20,54A34,34 0,0 1,37,24.56L47.5,42.74A13,13 0,0 0,41,54Z" />
                  <path
                      android:fillColor="#111111"
                      android:pathData="M60.5,42.74L71,24.56A34,34 0,0 1,88,54L67,54A13,13 0,0 0,60.5,42.74Z" />
                  <path
                      android:fillColor="#111111"
                      android:pathData="M60.5,65.26L71,83.44A34,34 0,0 1,37,83.44L47.5,65.26A13,13 0,0 0,60.5,65.26Z" />
              </vector>
          """)

          save(
              "app/src/main/java/com/iirco/ndt/MainActivity.java",
              """
              package com.iirco.ndt;

              import android.app.Activity;
              import android.os.Build;
              import android.os.Bundle;
              import android.graphics.Color;
              import android.view.WindowInsets;
              import android.webkit.WebResourceRequest;
              import android.webkit.WebSettings;
              import android.webkit.WebView;
              import android.webkit.WebViewClient;
              import android.widget.FrameLayout;

              public class MainActivity extends Activity {
                  private static final String HOME =
                      "file:///android_asset/index.html";

                  private WebView webView;

                  @Override
                  public void onCreate(Bundle state) {
                      super.onCreate(state);

                      FrameLayout root = new FrameLayout(this);
                      root.setBackgroundColor(Color.rgb(16, 24, 39));
                      setContentView(root);

                      root.setOnApplyWindowInsetsListener((view, insets) -> {
                          if (Build.VERSION.SDK_INT >= 30) {
                              android.graphics.Insets bars = insets.getInsets(
                                  WindowInsets.Type.systemBars()
                                  | WindowInsets.Type.displayCutout()
                                  | WindowInsets.Type.ime()
                              );
                              view.setPadding(
                                  bars.left, bars.top,
                                  bars.right, bars.bottom
                              );
                          } else {
                              view.setPadding(
                                  insets.getSystemWindowInsetLeft(),
                                  insets.getSystemWindowInsetTop(),
                                  insets.getSystemWindowInsetRight(),
                                  insets.getSystemWindowInsetBottom()
                              );
                          }
                          return insets;
                      });

                      webView = new WebView(this);
                      webView.setBackgroundColor(Color.rgb(16, 24, 39));
                      root.addView(
                          webView,
                          new FrameLayout.LayoutParams(-1, -1)
                      );

                      WebSettings settings = webView.getSettings();
                      settings.setJavaScriptEnabled(true);
                      settings.setAllowFileAccess(false);
                      settings.setAllowContentAccess(false);
                      settings.setAllowFileAccessFromFileURLs(false);
                      settings.setAllowUniversalAccessFromFileURLs(false);
                      settings.setBlockNetworkLoads(true);
                      settings.setMixedContentMode(
                          WebSettings.MIXED_CONTENT_NEVER_ALLOW
                      );

                      webView.setWebViewClient(new WebViewClient() {
                          @Override
                          public boolean shouldOverrideUrlLoading(
                              WebView view,
                              WebResourceRequest request
                          ) {
                              return !HOME.equals(
                                  request.getUrl().toString()
                              );
                          }

                          @Override
                          public boolean shouldOverrideUrlLoading(
                              WebView view,
                              String url
                          ) {
                              return !HOME.equals(url);
                          }
                      });

                      if (state == null
                          || webView.restoreState(state) == null) {
                          webView.loadUrl(HOME);
                      }

                      root.requestApplyInsets();
                  }

                  @Override
                  protected void onSaveInstanceState(Bundle state) {
                      webView.saveState(state);
                      super.onSaveInstanceState(state);
                  }

                  @Override
                  protected void onDestroy() {
                      if (webView != null) {
                          ((FrameLayout) webView.getParent())
                              .removeView(webView);
                          webView.destroy();
                      }
                      super.onDestroy();
                  }
              }
              """
          )

          assets = project / "app/src/main/assets"
          assets.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(source, assets / "index.html")
          PY

      - name: Build release APK
        run: gradle --no-daemon -p android-project :app:assembleRelease

      - name: Sign and verify APK
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.HECTOR }}
          KEYSTORE_PASSWORD: ${{ secrets.HECTOR1 }}
        run: |
          set -euo pipefail
          umask 077

          if [ -z "${KEYSTORE_BASE64:-}" ] || \
             [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "Missing HECTOR or HECTOR1 secret."
            exit 1
          fi

          KEYSTORE="$RUNNER_TEMP/iirco-release.jks"
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          UNSIGNED="android-project/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="$RUNNER_TEMP/iirco-aligned.apk"

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode > "$KEYSTORE"

          "$TOOLS/zipalign" \
            -P 16 -f 4 "$UNSIGNED" "$ALIGNED"

          "$TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-type PKCS12 \
            --ks-key-alias iirco \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEYSTORE_PASSWORD \
            --out IIRCo-NDT-release.apk \
            "$ALIGNED"

          "$TOOLS/apksigner" verify \
            --verbose \
            --print-certs \
            IIRCo-NDT-release.apk

          "$TOOLS/zipalign" \
            -c -P 16 4 IIRCo-NDT-release.apk

      - name: Remove temporary signing files
        if: always()
        shell: bash
        run: |
          rm -f \
            "$RUNNER_TEMP/iirco-release.jks" \
            "$RUNNER_TEMP/iirco-aligned.apk"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: IIRCo-NDT-Signed-Release
          path: IIRCo-NDT-release.apk
          if-no-files-found: error
