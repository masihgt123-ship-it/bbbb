name: Build IIRCo Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Android project and launcher icon
        shell: bash
        run: |
          python - <<'PYTHON'
          from pathlib import Path
          import shutil
          import textwrap

          source = Path("index.html")
          if not source.is_file():
              raise SystemExit(
                  "index.html must be in the repository root."
              )

          project = Path("android-project")

          def save(name, content):
              target = project / name
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(
                  textwrap.dedent(content).strip() + "\n",
                  encoding="utf-8",
              )

          save("settings.gradle", """
              pluginManagement {
                  repositories {
                      google()
                      mavenCentral()
                      gradlePluginPortal()
                  }
              }

              dependencyResolutionManagement {
                  repositoriesMode.set(
                      RepositoriesMode.FAIL_ON_PROJECT_REPOS
                  )
                  repositories {
                      google()
                      mavenCentral()
                  }
              }

              rootProject.name = 'IIRCoNDT'
              include ':app'
          """)

          save("build.gradle", """
              plugins {
                  id 'com.android.application' version '8.7.3' apply false
              }
          """)

          save("gradle.properties", """
              org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          """)

          save("app/build.gradle", """
              plugins {
                  id 'com.android.application'
              }

              android {
                  namespace 'com.iirco.ndt'
                  compileSdk 35

                  defaultConfig {
                      applicationId 'com.iirco.ndt'
                      minSdk 23
                      targetSdk 35
                      versionCode 2
                      versionName '1.1'
                  }

                  compileOptions {
                      sourceCompatibility JavaVersion.VERSION_17
                      targetCompatibility JavaVersion.VERSION_17
                  }
              }
          """)

          save("app/src/main/AndroidManifest.xml", """
              <?xml version="1.0" encoding="utf-8"?>
              <manifest xmlns:android="http://schemas.android.com/apk/res/android">

                  <!-- Offline app: no INTERNET permission. -->

                  <application
                      android:allowBackup="false"
                      android:label="IIRCo NDT"
                      android:icon="@drawable/ic_radiation"
                      android:roundIcon="@drawable/ic_radiation"
                      android:supportsRtl="true"
                      android:usesCleartextTraffic="false"
                      android:theme="@android:style/Theme.Material.NoActionBar">

                      <activity
                          android:name=".MainActivity"
                          android:exported="true"
                          android:windowSoftInputMode="adjustResize">

                          <intent-filter>
                              <action android:name="android.intent.action.MAIN"/>
                              <category android:name="android.intent.category.LAUNCHER"/>
                          </intent-filter>

                      </activity>
                  </application>
              </manifest>
          """)

          save(
              "app/src/main/java/com/iirco/ndt/MainActivity.java",
              """
              package com.iirco.ndt;

              import android.app.Activity;
              import android.os.Build;
              import android.os.Bundle;
              import android.graphics.Color;
              import android.view.WindowInsets;
              import android.webkit.WebResourceRequest;
              import android.webkit.WebResourceResponse;
              import android.webkit.WebSettings;
              import android.webkit.WebView;
              import android.webkit.WebViewClient;
              import android.widget.FrameLayout;
              import java.io.ByteArrayInputStream;

              public class MainActivity extends Activity {
                  private static final String HOME =
                      "file:///android_asset/index.html";

                  private WebView webView;

                  @Override
                  public void onCreate(Bundle state) {
                      super.onCreate(state);

                      FrameLayout root = new FrameLayout(this);
                      root.setBackgroundColor(Color.rgb(16, 24, 39));
                      setContentView(root);

                      root.setOnApplyWindowInsetsListener((view, insets) -> {
                          if (Build.VERSION.SDK_INT >= 30) {
                              android.graphics.Insets bars = insets.getInsets(
                                  WindowInsets.Type.systemBars()
                                  | WindowInsets.Type.displayCutout()
                                  | WindowInsets.Type.ime()
                              );
                              view.setPadding(
                                  bars.left, bars.top,
                                  bars.right, bars.bottom
                              );
                          } else {
                              view.setPadding(
                                  insets.getSystemWindowInsetLeft(),
                                  insets.getSystemWindowInsetTop(),
                                  insets.getSystemWindowInsetRight(),
                                  insets.getSystemWindowInsetBottom()
                              );
                          }
                          return insets;
                      });

                      webView = new WebView(this);
                      webView.setBackgroundColor(Color.rgb(16, 24, 39));

                      root.addView(
                          webView,
                          new FrameLayout.LayoutParams(-1, -1)
                      );

                      WebSettings settings = webView.getSettings();
                      settings.setJavaScriptEnabled(true);
                      settings.setAllowFileAccess(false);
                      settings.setAllowContentAccess(false);
                      settings.setAllowFileAccessFromFileURLs(false);
                      settings.setAllowUniversalAccessFromFileURLs(false);
                      settings.setBlockNetworkLoads(true);
                      settings.setMixedContentMode(
                          WebSettings.MIXED_CONTENT_NEVER_ALLOW
                      );

                      webView.setWebViewClient(new WebViewClient() {
                          @Override
                          public boolean shouldOverrideUrlLoading(
                              WebView view,
                              WebResourceRequest request
                          ) {
                              return !HOME.equals(
                                  request.getUrl().toString()
                              );
                          }

                          @Override
                          public boolean shouldOverrideUrlLoading(
                              WebView view,
                              String url
                          ) {
                              return !HOME.equals(url);
                          }

                          @Override
                          public WebResourceResponse shouldInterceptRequest(
                              WebView view,
                              WebResourceRequest request
                          ) {
                              String url = request.getUrl().toString();

                              if (HOME.equals(url)
                                  || url.startsWith("data:")) {
                                  return null;
                              }

                              return new WebResourceResponse(
                                  "text/plain",
                                  "UTF-8",
                                  new ByteArrayInputStream(new byte[0])
                              );
                          }
                      });

                      if (state == null
                          || webView.restoreState(state) == null) {
                          webView.loadUrl(HOME);
                      }

                      root.requestApplyInsets();
                  }

                  @Override
                  protected void onSaveInstanceState(Bundle state) {
                      webView.saveState(state);
                      super.onSaveInstanceState(state);
                  }

                  @Override
                  protected void onDestroy() {
                      if (webView != null) {
                          ((FrameLayout) webView.getParent())
                              .removeView(webView);
                          webView.destroy();
                          webView = null;
                      }
                      super.onDestroy();
                  }
              }
              """
          )

          # Legacy launcher icon, also used as adaptive foreground.
          save("app/src/main/res/drawable/ic_radiation.xml", """
              <?xml version="1.0" encoding="utf-8"?>
              <vector xmlns:android="http://schemas.android.com/apk/res/android"
                  android:width="108dp"
                  android:height="108dp"
                  android:viewportWidth="108"
                  android:viewportHeight="108">

                  <path
                      android:fillColor="#E9C023"
                      android:pathData="M0,0H108V108H0Z"/>

                  <group
                      android:pivotX="54"
                      android:pivotY="54"
                      android:scaleX="0.75"
                      android:scaleY="0.75">

                      <path
                          android:fillColor="#000000"
                          android:pathData="M34,19.359
                              A40,40 0,0 1,74,19.359
                              L60,43.608
                              A12,12 0,0 0,48,43.608Z"/>

                      <path
                          android:fillColor="#000000"
                          android:pathData="M94,54
                              A40,40 0,0 1,74,88.641
                              L60,64.392
                              A12,12 0,0 0,66,54Z"/>

                      <path
                          android:fillColor="#000000"
                          android:pathData="M34,88.641
                              A40,40 0,0 1,14,54
                              L42,54
                              A12,12 0,0 0,48,64.392Z"/>

                      <path
                          android:fillColor="#000000"
                          android:pathData="M61,54
                              A7,7 0,1 1,47,54
                              A7,7 0,1 1,61,54Z"/>
                  </group>
              </vector>
          """)

          save(
              "app/src/main/res/drawable/ic_launcher_background.xml",
              """
              <?xml version="1.0" encoding="utf-8"?>
              <shape xmlns:android="http://schemas.android.com/apk/res/android"
                  android:shape="rectangle">
                  <solid android:color="#E9C023"/>
              </shape>
              """
          )

          # Android 8+ uses the adaptive version of the same drawable.
          save(
              "app/src/main/res/drawable-anydpi-v26/ic_radiation.xml",
              """
              <?xml version="1.0" encoding="utf-8"?>
              <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
                  <background android:drawable="@drawable/ic_launcher_background"/>
                  <foreground android:drawable="@drawable/ic_radiation_foreground"/>
              </adaptive-icon>
              """
          )

          foreground = (
              project / "app/src/main/res/drawable/ic_radiation.xml"
          )
          shutil.copyfile(
              foreground,
              foreground.with_name("ic_radiation_foreground.xml")
          )

          assets = project / "app/src/main/assets"
          assets.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(source, assets / "index.html")

          # Remove the specific footer label if still present.
          html_file = assets / "index.html"
          html = html_file.read_text(encoding="utf-8")
          html = html.replace("نسخهٔ آزمایشی", "محاسبات برآوردی")
          html = html.replace("نسخه آزمایشی", "محاسبات برآوردی")
          html_file.write_text(html, encoding="utf-8")

          # Validate generated XML before starting the Android build.
          import xml.etree.ElementTree as ET
          for xml_file in (project / "app/src/main").rglob("*.xml"):
              ET.parse(xml_file)

          print("Android project, offline HTML and icon are ready.")
          PYTHON

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon -p android-project :app:assembleDebug

      - name: Prepare APK download
        run: |
          cp \
            android-project/app/build/outputs/apk/debug/app-debug.apk \
            IIRCo-NDT-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IIRCo-NDT-APK
          path: IIRCo-NDT-debug.apk
          if-no-files-found: error
