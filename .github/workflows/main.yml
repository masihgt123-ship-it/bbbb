name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Prepare Android project from index.html
        shell: bash
        run: |
          python - <<'PYTHON'
          from pathlib import Path
          import json
          import shutil
          source = Path("index.html")
          if not source.is_file():
              raise SystemExit("Upload index.html to the repository root first.")
          project = Path("android-project")
          files = json.loads('{"settings.gradle": "pluginManagement {\\n    repositories { google(); mavenCentral(); gradlePluginPortal() }\\n}\\ndependencyResolutionManagement {\\n    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)\\n    repositories { google(); mavenCentral() }\\n}\\nrootProject.name = \'IIRCoNDT\'\\ninclude \':app\'\\n", "build.gradle": "plugins {\\n    id \'com.android.application\' version \'8.7.3\' apply false\\n}\\n", "gradle.properties": "org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8\\n", "app/build.gradle": "plugins {\\n    id \'com.android.application\'\\n}\\n\\nandroid {\\n    namespace \'com.iirco.ndt\'\\n    compileSdk 35\\n\\n    defaultConfig {\\n        applicationId \'com.iirco.ndt\'\\n        minSdk 23\\n        targetSdk 35\\n        versionCode 1\\n        versionName \'1.0\'\\n    }\\n\\n    compileOptions {\\n        sourceCompatibility JavaVersion.VERSION_17\\n        targetCompatibility JavaVersion.VERSION_17\\n    }\\n}\\n", "app/src/main/AndroidManifest.xml": "<?xml version=\\"1.0\\" encoding=\\"utf-8\\"?>\\n<manifest xmlns:android=\\"http://schemas.android.com/apk/res/android\\">\\n    <!-- Intentionally no INTERNET permission: calculator assets are bundled. -->\\n    <application\\n        android:allowBackup=\\"false\\"\\n        android:label=\\"IIRCo NDT\\"\\n        android:supportsRtl=\\"true\\"\\n        android:usesCleartextTraffic=\\"false\\"\\n        android:theme=\\"@android:style/Theme.Material.NoActionBar\\">\\n        <activity\\n            android:name=\\".MainActivity\\"\\n            android:exported=\\"true\\"\\n            android:windowSoftInputMode=\\"adjustResize\\">\\n            <intent-filter>\\n                <action android:name=\\"android.intent.action.MAIN\\" />\\n                <category android:name=\\"android.intent.category.LAUNCHER\\" />\\n            </intent-filter>\\n        </activity>\\n    </application>\\n</manifest>\\n", "app/src/main/java/com/iirco/ndt/MainActivity.java": "package com.iirco.ndt;\\n\\nimport android.app.Activity;\\nimport android.os.Build;\\nimport android.os.Bundle;\\nimport android.graphics.Color;\\nimport android.view.View;\\nimport android.view.WindowInsets;\\nimport android.webkit.WebResourceRequest;\\nimport android.webkit.WebResourceResponse;\\nimport android.webkit.WebSettings;\\nimport android.webkit.WebView;\\nimport android.webkit.WebViewClient;\\nimport android.widget.FrameLayout;\\nimport java.io.ByteArrayInputStream;\\n\\npublic class MainActivity extends Activity {\\n    private static final String HOME = \\"file:///android_asset/index.html\\";\\n    private WebView webView;\\n\\n    @Override\\n    public void onCreate(Bundle state) {\\n        super.onCreate(state);\\n        FrameLayout root = new FrameLayout(this);\\n        root.setBackgroundColor(Color.rgb(16, 24, 39));\\n        setContentView(root);\\n\\n        // Keep content clear of status/navigation bars, including Android 15.\\n        root.setOnApplyWindowInsetsListener((view, insets) -> {\\n            if (Build.VERSION.SDK_INT >= 30) {\\n                android.graphics.Insets bars = insets.getInsets(\\n                    WindowInsets.Type.systemBars() | WindowInsets.Type.displayCutout()\\n                    | WindowInsets.Type.ime());\\n                view.setPadding(bars.left, bars.top, bars.right, bars.bottom);\\n            } else {\\n                view.setPadding(insets.getSystemWindowInsetLeft(),\\n                    insets.getSystemWindowInsetTop(),\\n                    insets.getSystemWindowInsetRight(),\\n                    insets.getSystemWindowInsetBottom());\\n            }\\n            return insets;\\n        });\\n\\n        webView = new WebView(this);\\n        webView.setBackgroundColor(Color.rgb(16, 24, 39));\\n        root.addView(webView, new FrameLayout.LayoutParams(-1, -1));\\n        WebSettings settings = webView.getSettings();\\n        settings.setJavaScriptEnabled(true);\\n        settings.setAllowFileAccess(false);\\n        settings.setAllowContentAccess(false);\\n        settings.setAllowFileAccessFromFileURLs(false);\\n        settings.setAllowUniversalAccessFromFileURLs(false);\\n        settings.setBlockNetworkLoads(true);\\n        settings.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);\\n        // file:///android_asset is available even when general file access is off.\\n        webView.setWebViewClient(new WebViewClient() {\\n            @Override\\n            public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {\\n                return !HOME.equals(request.getUrl().toString());\\n            }\\n\\n            @Override\\n            public boolean shouldOverrideUrlLoading(WebView view, String url) {\\n                return !HOME.equals(url);\\n            }\\n\\n            @Override\\n            public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {\\n                String url = request.getUrl().toString();\\n                if (HOME.equals(url) || url.startsWith(\\"data:\\")) return null;\\n                return new WebResourceResponse(\\"text/plain\\", \\"UTF-8\\",\\n                    new ByteArrayInputStream(new byte[0]));\\n            }\\n        });\\n        if (state == null || webView.restoreState(state) == null) {\\n            webView.loadUrl(HOME);\\n        }\\n        root.requestApplyInsets();\\n    }\\n\\n    @Override\\n    protected void onSaveInstanceState(Bundle state) {\\n        webView.saveState(state);\\n        super.onSaveInstanceState(state);\\n    }\\n\\n    @Override\\n    protected void onDestroy() {\\n        if (webView != null) {\\n            ((FrameLayout) webView.getParent()).removeView(webView);\\n            webView.destroy();\\n        }\\n        super.onDestroy();\\n    }\\n}\\n"}')
          for name, text in files.items():
              target = project / name
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(text, encoding="utf-8")
          assets = project / "app/src/main/assets"
          assets.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(source, assets / "index.html")
          PYTHON

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable debug APK
        run: gradle --no-daemon -p android-project :app:assembleDebug

      - name: Name APK
        run: cp android-project/app/build/outputs/apk/debug/app-debug.apk IIRCo-NDT-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IIRCo-NDT-APK
          path: IIRCo-NDT-debug.apk
          if-no-files-found: error
